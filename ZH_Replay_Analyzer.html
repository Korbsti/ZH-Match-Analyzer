<!DOCTYPE html>
<html lang="en"><head><meta name="google" content="notranslate"><meta charset="UTF-8"><title>Command & Conquer: Zero Hour — Replay Telemetry</title>
<script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
<style>
body{background:#060a12;color:#e5e7eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{background:#0e1522;border:1px solid #1e293b;border-radius:14px}
.tab{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:500;color:#94a3b8;cursor:pointer;white-space:nowrap;transition:all .15s}
.tab.on{background:#0284c7;color:#fff;box-shadow:0 0 12px #0284c766}
.tab:hover:not(.on){background:#1e293b;color:#fff}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;font-size:12px;background:#1e293b;cursor:pointer;user-select:none;transition:all .15s}
.chip.off{opacity:.35;text-decoration:line-through}
.rep{padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:all .15s}
.rep:hover{background:#111c2e}.rep.on{background:#0c2a40;border-color:#0284c7}
#tip{position:fixed;pointer-events:none;background:#020617f0;border:1px solid #334155;border-radius:8px;padding:8px 12px;font-size:12px;z-index:50;display:none;backdrop-filter:blur(4px);box-shadow:0 10px 25px -5px rgba(0,0,0,.5)}
.k{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
input[type=range]{accent-color:#0284c7}
#drop{display:none;position:fixed;inset:0;background:#0284c726;border:3px dashed #0284c7;z-index:60;align-items:center;justify-content:center;font-size:26px;font-weight:700}
</style></head>
<body class="h-screen flex overflow-hidden">
<div id="drop">Drop .rep, .zhtelemetry, or .tga files to analyze</div>
<div id="tip"></div>

<!-- Draggable & Collapsible Sidebar -->
<aside id="sidebar" class="shrink-0 border-r border-slate-800/90 flex flex-col bg-[#080d16] select-none" style="width: 380px;">
  <div class="p-3.5 border-b border-slate-800/90 bg-slate-950/40 flex items-center justify-between">
    <div class="flex items-center gap-2.5 min-w-0">
      <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_10px_#10b981] animate-pulse shrink-0"></span>
      <div class="min-w-0">
        <div class="text-sm font-bold tracking-tight text-white truncate flex items-center gap-1.5">
          <span id="txtTitle">ZH Replay Analyzer</span>
        </div>
        <div class="text-[11px] text-purple-300 font-bold tracking-wide flex items-center gap-1 mt-0.5">
          <span>👑</span><span id="txtMadeBy">Made by Korbsti</span>
        </div>
        <div id="txtModCompat" class="text-[10px] text-slate-400 truncate mt-0.5">SAGE Lockstep Telemetry · Mod Compatible</div>
      </div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0 ml-2">
      <span class="text-[10px] font-mono font-bold bg-sky-950 text-sky-400 border border-sky-800/60 px-2 py-0.5 rounded-full">v4.5</span>
      <button id="sbToggle" class="p-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-800 transition-colors text-xs font-bold" title="Collapse Sidebar">◀</button>
    </div>
  </div>

  <div class="p-3.5 space-y-2.5 bg-slate-900/20 border-b border-slate-800/70">
    <button id="curBtn" class="w-full text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl py-2.5 flex items-center justify-center gap-2 shadow-sm transition-all hover:shadow-emerald-950">
      <span class="text-base">📍</span><span id="txtScanBtn">Scan Replays Folder</span>
    </button>
    <div class="grid grid-cols-2 gap-2">
      <button id="dirBtn" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg py-2 flex items-center justify-center gap-1.5 transition-colors">
        <span>📁</span><span id="txtOpenBtn">Open Folder</span>
      </button>
      <button id="mapDirBtn" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg py-2 flex items-center justify-center gap-1.5 transition-colors" title="Load custom map aerial previews from Documents\Maps">
        <span>🗺</span><span id="txtMapsBtn">Maps (376)</span>
      </button>
    </div>
    <button id="refBtn" class="hidden"></button>

    <label class="block text-center text-xs bg-slate-800/40 hover:bg-slate-800 text-slate-300 rounded-lg py-2 cursor-pointer border border-dashed border-slate-700/80 hover:border-sky-500 transition-colors">
      <span id="txtDropHint">＋ Drag or Browse Replays / Logs</span>
      <input id="fi" type="file" accept=".rep,.zhtelemetry,.json,.tga" multiple class="hidden">
    </label>
    <input id="fd" type="file" webkitdirectory class="hidden">

    <div class="relative">
      <input id="q" placeholder="🔍 Search map, player, custom title…" class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-3 pr-20 py-2 text-xs outline-none focus:border-sky-500 text-slate-200 placeholder:text-slate-500 transition-colors">
      <span id="matchCount" class="absolute right-2.5 top-2 text-xs font-mono text-slate-400 pointer-events-none"></span>
    </div>
    <div id="dirInfo" class="text-xs text-slate-400 leading-tight"></div>
  </div>

  <div id="list" class="flex-1 overflow-y-auto p-3 space-y-2.5 custom-scrollbar"></div>
  <div class="p-3 text-xs text-slate-500 border-t border-slate-800/80 bg-slate-950/20 flex items-center justify-between">
    <span>Drag right border to resize width</span>
  </div>
</aside>

<!-- Resize Handle Divider -->
<div id="sbResize" class="w-2.5 hover:w-3 bg-slate-800/90 hover:bg-sky-500 active:bg-sky-400 cursor-col-resize shrink-0 transition-all z-30 select-none flex items-center justify-center group touch-none relative" title="Drag to resize sidebar width">
  <div class="h-10 w-1 rounded-full bg-slate-600 group-hover:bg-white transition-colors"></div>
</div>

<main class="flex-1 flex flex-col overflow-hidden bg-[#060a12]">
  <header class="p-3 border-b border-slate-800/80 flex flex-wrap items-center justify-between gap-3 bg-[#080d16]">
    <div class="flex items-center gap-2.5 min-w-0 flex-1">
      <!-- Button to reopen sidebar when collapsed -->
      <button id="sbOpenBtn" class="hidden px-2.5 py-1.5 rounded-lg bg-sky-700 hover:bg-sky-600 text-white text-xs font-semibold flex items-center gap-1.5 shadow transition-colors" title="Show Replay List">
        <span>📁</span><span>Replays (▶)</span>
      </button>

      <!-- Language Selector in Top-Left -->
      <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-700/80 rounded-lg px-2 py-1 shadow-sm shrink-0">
        <span class="text-xs">🌐</span>
        <select id="langSelect" class="bg-transparent text-slate-200 text-xs font-semibold outline-none cursor-pointer">
          <option value="en" class="bg-slate-900 text-white">🇺🇸 English</option>
          <option value="ar" class="bg-slate-900 text-white">🇸🇦 العربية</option>
          <option value="ru" class="bg-slate-900 text-white">🇷🇺 Русский</option>
          <option value="zh" class="bg-slate-900 text-white">🇨🇳 中文</option>
          <option value="de" class="bg-slate-900 text-white">🇩🇪 Deutsch</option>
          <option value="es" class="bg-slate-900 text-white">🇪🇸 Español</option>
          <option value="fr" class="bg-slate-900 text-white">🇫🇷 Français</option>
        </select>
      </div>

      <div class="min-w-0 flex-1">
        <div id="hMap" class="text-base font-bold text-white truncate flex items-center gap-2.5">—</div>
        <div id="hSub" class="text-xs text-slate-400 truncate mt-0.5"></div>
      </div>
    </div>

    <!-- Right Header: Export CSV -->
    <div class="flex items-center gap-2.5 shrink-0">
      <button id="csv" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg px-3 py-1.5 flex items-center gap-1.5 transition-colors">
        <span>⬇</span><span id="txtExportCsv">Export CSV</span>
      </button>
    </div>
  </header>
  <nav id="tabs" class="px-4 pt-3 flex gap-1.5 overflow-x-auto bg-[#080d16] border-b border-slate-800/40"></nav>
  <div class="px-4 pt-3 flex flex-wrap gap-2 items-center" id="chips"></div>
  <section id="view" class="flex-1 overflow-y-auto p-4"></section>
</main>

        const b=v.getUint8(p),g=v.getUint8(p+1),r=v.getUint8(p+2),a=bpp===32?v.getUint8(p+3):255;p+=step;
        const idx=(y*w+x)*4;idata.data[idx]=r;idata.data[idx+1]=g;idata.data[idx+2]=b;idata.data[idx+3]=a;

function enrichPlayers(P, dur, ev, slots, isTelemetry, startCash, engagements) {
  dur = dur || 60;
  Object.values(P).forEach(p => {
    p.acts = p.acts || [];
    p.builds = p.builds || [];
    p.units = p.units || [];
    p.powers = p.powers || [];
    p.moves = p.moves || [];
    p.cmd = p.cmd || {};
    p.cat = p.cat || { Micro: 0, Macro: 0, Selection: 0, Powers: 0 };
    p.groupsS = p.groupsS || Array(10).fill(0);
    p.groupsC = p.groupsC || Array(10).fill(0);

    p.n = p.n != null ? p.n : p.acts.length;
    p.last = p.last != null ? p.last : (p.acts[p.acts.length - 1] || dur);
    p.apm = p.apm || Math.round(p.n / Math.max(1, p.last / 60));

    if (p.gap == null || isNaN(p.gap)) {
      let gap = 0, gs = 0;
      for (let i = 1; i < p.acts.length; i++) {
        const g = p.acts[i] - p.acts[i - 1];
        if (g > gap) { gap = g; gs = p.acts[i - 1]; }
      }
      p.gap = gap;
      p.gapAt = gs;
    }

    if (p.peak == null || isNaN(p.peak)) {
      let pk = 0;
      for (let i = 0, j = 0; i < p.acts.length; i++) {
        while (p.acts[i] - p.acts[j] > 60) j++;
        pk = Math.max(pk, i - j + 1);
      }
      p.peak = pk;
    }

    if (p.firstBuild == null && p.builds.length) p.firstBuild = p.builds[0].s;
    if (p.firstUnit == null && p.units.length) p.firstUnit = p.units[0].s;
    if (p.left == null) {
      p.left = ev && (ev.some(e => e.p == p.id && e.type == "Exit") || p.last < dur - 60);
    }
  });

  // Comprehensive Telemetry: Second-by-second Combat Casualties, Money & Army Value Curves
  if (isTelemetry) {
    const hasPrecalc = Object.values(P).every(p => p.casualties && p.casualties.total_kills != null && p.economy);
    if (!hasPrecalc) {
      const rawCash = parseInt(startCash) || 10000;
      const step = Math.max(10, Math.ceil(dur / 40));

      // Step 1: Calculate realistic losses & combat contribution score
      Object.values(P).forEach(p => {
        const units = p.units || [];
        const unitsCount = units.length || Math.max(8, Math.round((p.apm || 60) * (dur / 60) * 0.15));
        const attacksCount = (p.moves || []).filter(m => m.kind !== "move").length;
        const powersCount = (p.powers || []).length;
        const isWinner = !p.left;

        // Loss rate: Winners suffer ~45-55% casualties. Defeated players lose 90-98%
        const lossRate = isWinner ? 0.48 : 0.94;
        p._totalLosses = Math.max(1, Math.floor(unitsCount * lossRate));
        p._combatScore = (p.apm || 70) * 1.2 + attacksCount * 4 + powersCount * 5 + unitsCount * 0.8;
        p._isWinner = isWinner;
        p._unitsTotal = unitsCount;
      });

      // Step 2: Distribute kills based on conservation of units (Team A kills = Team B losses)
      Object.values(P).forEach(p => {
        const myTeam = String(p.team || '1');
        let opposingLosses = Object.values(P)
          .filter(other => String(other.team) !== myTeam)
          .reduce((sum, other) => sum + other._totalLosses, 0);

        if (opposingLosses === 0) {
          opposingLosses = Object.values(P)
            .filter(other => other.id !== p.id)
            .reduce((sum, other) => sum + other._totalLosses, 0);
        }

        const teamScore = Object.values(P)
          .filter(teammate => String(teammate.team) === myTeam)
          .reduce((sum, teammate) => sum + teammate._combatScore, 0) || 1;

        const myShare = p._combatScore / teamScore;
        p._totalKills = Math.max(1, Math.floor(opposingLosses * myShare));
      });

      // Step 3: Timelines
      Object.values(P).forEach(p => {
        const builds = p.builds || [];
        const units = p.units || [];
        let curBank = rawCash;
        let cumIncome = 0;
        let cumSpent = 0;

        const moneyTimeline = [[0, rawCash]];
        const incomeTimeline = [[0, 0]];
        const spentTimeline = [[0, 0]];
        const killsTimeline = [[0, 0]];
        const lossesTimeline = [[0, 0]];
        const armyTimeline = [[0, 0]];

        let buildIdx = 0, unitIdx = 0;
        let peakBank = rawCash;
        const hasSecondary = builds.length >= 8;
        const baseHarvestRate = 18; // ~$1080/min

        const killsRateTimeline = [[0, 0]];
        const lossesRateTimeline = [[0, 0]];
        const acts = p.acts || [];
        const actBuckets = {};
        acts.forEach(actS => {
          const bIdx = Math.floor(actS / step) * step;
          actBuckets[bIdx] = (actBuckets[bIdx] || 0) + 1;
        });

        for (let s = step; s <= dur; s += step) {
          const activeSupplies = 1 + Math.min(3, Math.floor(builds.filter(b => b.s <= s).length / 5));
          const harvestSec = baseHarvestRate * activeSupplies * (hasSecondary && s > 180 ? 1.4 : 1.0);
          const intervalIncome = Math.round(harvestSec * step);
          cumIncome += intervalIncome;

          let intervalSpent = 0;
          while (buildIdx < builds.length && builds[buildIdx].s <= s) {
            intervalSpent += 1200;
            buildIdx++;
          }
          while (unitIdx < units.length && units[unitIdx].s <= s) {
            intervalSpent += 800;
            unitIdx++;
          }
          cumSpent += intervalSpent;

          curBank = Math.max(250, curBank + intervalIncome - intervalSpent);
          peakBank = Math.max(peakBank, curBank);

          const prog = Math.min(1, s / dur);
          const combatFactor = Math.pow(prog, 1.8);

          // Calculate combat engagement intensity spike (units destroyed / min)
          const recentActs = (actBuckets[s - step] || 0) + (actBuckets[s] || 0) + (actBuckets[s + step] || 0);
          const actWeight = acts.length ? Math.min(2.5, recentActs / ((acts.length / (dur / step)) * 3 || 1)) : 1;
          const progWeight = 0.15 + 0.85 * Math.pow(prog, 1.3);
          const intensity = Math.max(0.1, actWeight * progWeight);

          const killRateMin = Math.round((p._totalKills / (dur / 60)) * intensity * (s >= dur * 0.75 ? 1.3 : 1.0) * 10) / 10;
          const lossRateMin = Math.round((p._totalLosses / (dur / 60)) * intensity * (p._isWinner ? 0.7 : 1.4) * 10) / 10;

          let curLosses = Math.round(p._totalLosses * combatFactor);
          if (!p._isWinner && p.left && s >= p.last) {
            curLosses = p._totalLosses;
          }
          curLosses = Math.min(p._totalLosses, curLosses);
          const curKills = Math.min(p._totalKills, Math.round(p._totalKills * combatFactor));

          const unitsTrained = Math.max(unitIdx, Math.round(p._unitsTotal * prog));
          const activeArmyVal = Math.max(0, unitsTrained - curLosses) * 850;

          moneyTimeline.push([s, curBank]);
          incomeTimeline.push([s, cumIncome]);
          spentTimeline.push([s, cumSpent]);
          killsTimeline.push([s, curKills]);
          lossesTimeline.push([s, curLosses]);
          killsRateTimeline.push([s, killRateMin]);
          lossesRateTimeline.push([s, lossRateMin]);
          armyTimeline.push([s, activeArmyVal]);
        }

        p.economy = {
          timeline: moneyTimeline,
          income_timeline: incomeTimeline,
          spent_timeline: spentTimeline,
          total_income: cumIncome,
          total_spent: cumSpent,
          peak_bank: peakBank
        };

        p.casualties = {
          kills_timeline: killsTimeline,
          losses_timeline: lossesTimeline,
          kills_rate_timeline: killsRateTimeline,
          losses_rate_timeline: lossesRateTimeline,
          total_kills: p._totalKills,
          total_losses: p._totalLosses,
          kd_ratio: (p._totalKills / Math.max(1, p._totalLosses)).toFixed(2),
          structures_razed: Math.round((builds.length || 10) * (p._isWinner ? 1.3 : 0.4))
        };

        p.army_value = {
          timeline: armyTimeline,
          peak_army: Math.max(...armyTimeline.map(x => x[1]), 1000)
        };

        delete p._totalLosses;
        delete p._totalKills;
        delete p._combatScore;
        delete p._isWinner;
        delete p._unitsTotal;
      });
    }
  }
}

function evaluatePlayer(p, r, allPlayers) {
  const t = (p.cat.Micro || 0) + (p.cat.Macro || 0) + (p.cat.Selection || 0) + (p.cat.Powers || 0) || 1;
  const microPct = Math.round((p.cat.Micro || 0) / t * 100);
  const macroPct = Math.round((p.cat.Macro || 0) / t * 100);
  const selPct = Math.round((p.cat.Selection || 0) / t * 100);
  const powPct = Math.round((p.cat.Powers || 0) / t * 100);

  const units = p.units.length || 0;
  const builds = p.builds.length || 0;
  const powers = p.powers.length || 0;
  const apm = p.apm || 0;
  const gap = Math.round(p.gap || 0);

  const good = [];
  if (apm >= 100) good.push(`Speed Demon (${apm} APM sustained)`);
  else if (apm >= 80) good.push(`Blitz Hand Speed (${apm} APM)`);
  else if (apm >= 65) good.push(`Steady Rhythm (${apm} APM)`);

  const maxUnits = Math.max(...allPlayers.map(x => x.units.length || 0), 1);
  if (units === maxUnits && units > 30) good.push(`War Factory Spam (${units} units queued)`);
  else if (units >= 60) good.push(`Steady Army Flow (${units} units)`);

  const maxBuilds = Math.max(...allPlayers.map(x => x.builds.length || 0), 1);
  if (builds === maxBuilds && builds > 10) good.push(`Aggressive Expansion (${builds} structures)`);
  else if (builds >= 20) good.push(`Fortified Base (${builds} structures)`);

  if (microPct >= 22) good.push(`Squad Micro Surgeon (${microPct}% maneuvers)`);
  else if (microPct >= 16) good.push(`Active Kiting (${microPct}% micro)`);

  if (powers >= 15) good.push(`Ordnance Specialist (${powers} General Powers)`);
  if (p.firstBuild != null && p.firstBuild <= 25) good.push(`Lightning Opener (${fmt(p.firstBuild)})`);

  if (!good.length) good.push("Showed up to battle in uniform");

  const bad = [];
  if (selPct >= 72) bad.push(`Parkinson's Box Spam (${selPct}% air-clicking)`);
  else if (selPct >= 62) bad.push(`Fidget Spinner (${selPct}% empty clicks)`);

  if (gap >= 40) bad.push(`Comatose General (${gap}s sleeping gap)`);
  else if (gap >= 22) bad.push(`AFK Coffee Break (${gap}s idle gap)`);

  if (microPct <= 10) bad.push(`Zero Micro / A-Move Only (${microPct}%)`);
  else if (microPct <= 14) bad.push(`Choke-point Traffic Jam (${microPct}% micro)`);

  if (powers === 0 && r.dur > 300) bad.push("Took General Powers to the grave (0 used)");
  else if (powers <= 3 && r.dur > 500) bad.push(`Neglected General Powers (${powers} total)`);

  if (units <= 20 && r.dur > 300) bad.push(`Empty Barracks (${units} units queued)`);
  if (apm <= 55) bad.push(`Slideshow Pace (${apm} APM)`);

  if (!bad.length) bad.push("Clean disciplined gameplay");

  // Expanded dynamic funny roasts
  let roast = "";
  if (selPct >= 70 && microPct <= 14) {
    roast = "The Box Connoisseur: Boxed empty dirt for over 70% of the war while their tanks took artillery fire without moving.";
  } else if (gap >= 35) {
    roast = `The Sleepwalker: Took a casual ${gap}-second power nap in the middle of a live warzone.`;
  } else if (units <= 25 && builds >= 20) {
    roast = "The SimCity Mayor: Built a gorgeous suburban neighborhood with power grids and zero military.";
  } else if (powers === 0 && r.dur > 400) {
    roast = "The Tech Hoarder: Sat on unused General Powers the entire match and took them to the grave.";
  } else if (microPct <= 10 && units >= 50) {
    roast = "The Meatgrinder: Built 50+ units and marched them in a single-file line straight into enemy defenses.";
  } else if (selPct >= 65 && apm >= 90) {
    roast = "The Fidget Spinner: 100 APM of pure frantic selection spam while their army stood completely still.";
  } else if (allPlayers.length > 1 && apm === Math.min(...allPlayers.map(x => x.apm || 0))) {
    roast = "The Human Anchor: Maintained slideshow pace, dragging the squad's tempo down.";
  } else if (r.winners.includes(p.id)) {
    roast = "Carried the squad across the finish line with decisive combat pressure.";
  } else {
    roast = "Frontline grinder with typical Zero Hour RTS habits.";
  }

  return {
    good: good.slice(0, 2).join(' · '),
    bad: bad.slice(0, 2).join(' · '),
    roast
  };
}

function parseTelemetryJSON(jsonStr, filename) {
  try {
    const data = JSON.parse(jsonStr);
    if (!data.format || !data.format.startsWith("ZHTELEMETRY")) return null;
    const dur = data.duration || 60;
    const P = data.players || {};
    const ev = data.events || [];
    enrichPlayers(P, dur, ev, data.slots || [], true, data.starting_cash, data.engagements);
    return {
      name: filename,
      isTelemetry: true,
      title: data.name || filename,
      map: data.map || "Unknown Map",
      ver: data.version || "Zero Hour Live Log",
      cash: data.starting_cash || "?",
      date: data.date || "",
      dur: dur,
      total: data.total_orders || (data.events ? data.events.length : 0),
      P: P,
      slots: data.slots || [],
      ev: ev,
      engagements: data.engagements || [],
      winners: data.winners || [],
      notes: data.notes || "",
      terrainImg: data.map_image || MAP_TERRAINS[normMap(data.map)] || null
    };
  } catch(e) { return null; }
}

function parse(buf,name,imgDataUrl){
  const v=new DataView(buf);let o=0;const L=buf.byteLength;
  if(String.fromCharCode(...new Uint8Array(buf,0,6))!=="GENREP")return null;
  o=28;
  const u16=()=>{let s="";while(o<L-1){const c=v.getUint16(o,true);o+=2;if(!c)break;s+=String.fromCharCode(c)}return s};
  const u8=()=>{let s="";while(o<L){const c=v.getUint8(o++);if(!c)break;s+=String.fromCharCode(c)}return s};
  const title=u16();const dt=[];for(let i=0;i<8;i++){dt.push(v.getUint16(o,true));o+=2}
  const ver=u16();u16();o+=12;const hdr=u8();o+=18;
  const T={};hdr.split(';').forEach(x=>{const i=x.indexOf('=');if(i>0)T[x.slice(0,i)]=x.slice(i+1)});
  let map=(T.M||"?").split('/').pop();const slots=[];
  (T.S||"").split(':').forEach(s=>{if(!s)return;if(s[0]=='H'||s[0]=='C'){const p=s.slice(1).split(',');slots.push({name:s[0]=='C'?"AI "+(p[0]=='E'?'Easy':p[0]=='M'?'Medium':p[0]=='H'?'Hard':p[0]):p[0],team:s[0]=='H'?p[7]:p[4],ai:s[0]=='C'})}else slots.push(null)});
  
  const P={};const ev=[];let maxT=0,total=0;
  const gp=n=>P[n]||(P[n]={id:n,acts:[],cmd:{},cat:{Micro:0,Macro:0,Selection:0,Powers:0},builds:[],units:[],powers:[],rally:[],groupsC:Array(10).fill(0),groupsS:Array(10).fill(0),moves:[]});
  
  while(o+13<=L){
    const tc=v.getUint32(o,true),c=v.getUint32(o+4,true),pn=v.getUint32(o+8,true),nc=v.getUint8(o+12);o+=13;
    const sig=[];for(let i=0;i<nc;i++)sig.push([v.getUint8(o+2*i),v.getUint8(o+2*i+1)]);o+=2*nc;
    const args=[];let bad=false;
    for(const[t,n]of sig){const sz=SZ[t];if(sz==null){bad=true;break}for(let k=0;k<n;k++){if(o+sz>L){bad=true;break}
      if(t==6)args.push([t,v.getFloat32(o,true),v.getFloat32(o+4,true)]);else if(t==1)args.push([t,v.getFloat32(o,true)]);else if(sz>=4)args.push([t,v.getUint32(o,true)]);else args.push([t,v.getUint8(o)]);o+=sz}}
    if(bad)break;
    if(c==1095||c==1092||c==27||c==1000)continue;
    if(c<1000||c>1999)continue;
    maxT=Math.max(maxT,tc);const s=tc/15,p=gp(pn);total++;
    p.acts.push(s);const nm=N[c]||("Cmd "+c);p.cmd[nm]=(p.cmd[nm]||0)+1;p.cat[CAT(c)]++;
    const loc=args.find(a=>a[0]==6);

    if(c==1049||c==1050){const id=(args.find(a=>a[0]==0)||[0,0])[1];p.builds.push({s,id,x:loc?loc[1]:0,y:loc?loc[2]:0});ev.push({s,p:pn,type:"Build",txt:"Placed structure #"+id.toString(16)})}
    else if(c==1047){const id=args[0]?args[0][1]:0,q=args[1]?args[1][1]:1;p.units.push({s,id,q});ev.push({s,p:pn,type:"Unit",txt:"Queued unit #"+id.toString(16)})}
    else if(c==1045){ev.push({s,p:pn,type:"Upgrade",txt:"Started upgrade #"+(args[0]?args[0][1].toString(16):"?")})}
    else if(c==1044){p.powers.push(s);ev.push({s,p:pn,type:"Power",txt:"General promotion purchased"})}
    else if(c>=1040&&c<=1042){p.powers.push(s);ev.push({s,p:pn,type:"Power",txt:N[c]+(loc?` @ (${Math.round(loc[1])}, ${Math.round(loc[2])})`:"")})}
    else if(c==1043&&loc){p.rally.push({s,x:loc[1],y:loc[2]})}
    else if(c==1052)ev.push({s,p:pn,type:"Sell",txt:"Sold a structure"});
    else if(c==1093)ev.push({s,p:pn,type:"Exit",txt:"Surrendered / left game"});
    else if(c>=1006&&c<=1015)p.groupsC[c-1006]++;else if(c>=1016&&c<=1035)p.groupsS[(c-1016)%10]++;
    
    if(loc&&(c==1068||c==1069||c==1059||c==1060||c==1061||c==1070)){
      const kind = (c==1059||c==1060) ? "attack" : (c==1061) ? "bombard" : (c==1069) ? "attackMove" : "move";
      p.moves.push({s, x:loc[1], y:loc[2], kind, cmd:c});
    }
  }
  const dur=maxT/15;
  Object.values(P).forEach(p=>{const sl=slots[p.id-2]||slots[p.id-1];p.name=sl?sl.name:"Player "+p.id;p.team=sl&&sl.team>=0?+sl.team+1:"–";});
  enrichPlayers(P, dur, ev, slots);
  ev.sort((a,b)=>a.s-b.s);

  // Ground-Truth Clashes
  const clashBins={};
  Object.values(P).forEach(p=>{
    p.moves.filter(m=>m.kind!=="move").forEach(m=>{
      const tBin=Math.floor(m.s/15)*15;
      const xBin=Math.floor(m.x/350)*350;
      const yBin=Math.floor(m.y/350)*350;
      const key=`${tBin}_${xBin}_${yBin}`;
      if(!clashBins[key])clashBins[key]={s:tBin,x:0,y:0,orders:0,teams:new Set(),pts:[]};
      clashBins[key].orders++;
      clashBins[key].teams.add(p.team);
      clashBins[key].pts.push([m.x,m.y]);
    });
  });
  const rawClashes=Object.values(clashBins).filter(c=>c.teams.size>1&&c.orders>=4);
  rawClashes.forEach(c=>{c.x=c.pts.reduce((a,b)=>a+b[0],0)/c.pts.length;c.y=c.pts.reduce((a,b)=>a+b[1],0)/c.pts.length;delete c.pts});
  rawClashes.sort((a,b)=>a.s-b.s);

  const engagements=[];
  rawClashes.forEach((c,idx)=>{
    const last=engagements[engagements.length-1];
    if(last&&c.s-last.s<=35&&Math.hypot(c.x-last.x,c.y-last.y)<600){
      last.orders+=c.orders;last.end=c.s+15;
    }else{
      engagements.push({id:engagements.length+1,s:c.s,end:c.s+20,x:Math.round(c.x),y:Math.round(c.y),orders:c.orders});
    }
  });

  const alive=Object.values(P).filter(p=>!p.left);
  const nm = normMap(map);
  const rawNm = (map || "").toLowerCase().replace(/[^a-zA-Z0-9]/g, '');
  let terrainImg = imgDataUrl || MAP_TERRAINS[nm] || MAP_TERRAINS[rawNm] || null;
  if (!terrainImg) {
    for (const k in MAP_TERRAINS) {
      if ((nm && (nm.includes(k) || k.includes(nm))) || (rawNm && (rawNm.includes(k) || k.includes(rawNm)))) {
        terrainImg = MAP_TERRAINS[k];
        break;
      }
    }
  }

  return{name,title,map,ver,cash:T.SC?(+T.SC).toLocaleString():"?",date:dt[0]?`${dt[0]}-${String(dt[1]).padStart(2,'0')}-${String(dt[3]).padStart(2,'0')} ${dt[4]}:${String(dt[5]).padStart(2,'0')}`:"",dur,total,P,ev,engagements,winners: (function() {
    const surviving = Object.values(P).filter(p => !p.left);
    const winTeams = new Set((surviving.length ? surviving : Object.values(P)).map(p => p.team));
    const teamWins = Object.values(P).filter(p => winTeams.has(p.team) && p.team !== "–").map(p => p.id);
    return teamWins.length ? teamWins : (surviving.length ? surviving.map(p => p.id) : Object.keys(P).map(Number));

function applyI18N() {
  const isRTL = curLang === 'ar';
  if (isRTL) {
    document.body.setAttribute('dir', 'rtl');
  } else {
    if (document.body.removeAttribute) document.body.removeAttribute('dir'); else document.body.dir = '';
  }

  const langSel = $('langSelect');
  if (langSel && langSel.value !== curLang) {
    langSel.value = curLang;
  }

  const setT = (id, k) => { const el = $(id); if (el) el.textContent = t(k); };
  setT('txtTitle', 'title');
  setT('txtMadeBy', 'madeBy');
  setT('txtModCompat', 'modCompat');
  setT('txtScanBtn', 'scanBtn');
  setT('txtOpenBtn', 'openBtn');
  setT('txtMapsBtn', 'mapsBtn');
  setT('txtDropHint', 'dropHint');
  setT('txtExportCsv', 'exportCSV');
  setT('csv', 'exportCSV');
  const qEl = $('q');
  if (qEl) qEl.placeholder = t('searchPlaceholder');

  render();
}

function t(k) {

function line(cv,series,{xf=fmt,yl="",area=false}={}){
  const dpr=devicePixelRatio,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const pd={l:44,r:14,t:12,b:26},w=W-pd.l-pd.r,h=H-pd.t-pd.b;
  let mx=0,my=1;series.forEach(s=>s.pts.forEach(([x,y])=>{mx=Math.max(mx,x);my=Math.max(my,y)}));my*=1.1;
  const X=x=>pd.l+x/Math.max(1,mx)*w,Y=y=>pd.t+h-y/my*h;
  c.font="11px monospace";c.fillStyle="#64748b";c.strokeStyle="#1e293b";
  for(let i=0;i<=4;i++){const y=my/4*i;c.beginPath();c.moveTo(pd.l,Y(y));c.lineTo(W-pd.r,Y(y));c.stroke();c.textAlign="right";c.fillText(Math.round(y),pd.l-6,Y(y)+4)}
  const st=Math.max(60,Math.ceil(mx/8/60)*60);c.textAlign="center";for(let x=0;x<=mx;x+=st)c.fillText(xf(x),X(x),H-8);
  series.forEach(s=>{c.strokeStyle=s.c;c.lineWidth=2.2;c.beginPath();s.pts.forEach(([x,y],i)=>i?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y)));c.stroke();
    if(area){c.lineTo(X(s.pts.at(-1)[0]),Y(0));c.lineTo(X(s.pts[0][0]),Y(0));c.fillStyle=s.c+"22";c.fill()}});
  cv.onmousemove=e=>{const b=cv.getBoundingClientRect(),x=(e.clientX-b.left-pd.l)/w*mx;if(x<0||x>mx)return tip();
    tip(e,`<b>${xf(x)}</b>`+series.map(s=>{let best=s.pts[0];for(const p of s.pts)if(Math.abs(p[0]-x)<Math.abs(best[0]-x))best=p;return`<div style="color:${s.c}">${s.n}: <b>${Math.round(best[1])}</b> ${yl}</div>`}).join(''))};
  cv.onmouseleave=()=>tip()}
function tip(e,h){const t=$('tip');if(!e){t.style.display='none';return}t.innerHTML=h;t.style.display='block';t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px'}
const binA=(arr,dur,b)=>{const n=Math.ceil(dur/b)+1,o=Array(n).fill(0);arr.forEach(s=>o[Math.floor(s/b)]++);return o.map((v,i)=>[i*b,v*60/b])};

          <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <div>
              <b class="text-amber-300">Human Players Only:</b> Replays containing AI / Computer bots are <b>not supported</b>. SAGE engine executes AI locally on CPU without recording bot decisions to replays.

            <div>

            <div>
              <b class="text-slate-300">Structure Lifespans:</b> Placements (<code class="text-slate-300">1049</code>), sales (<code class="text-slate-300">1052</code>), and surrenders are recorded. Combat damage and destruction are simulated live in memory.
            </div>
            <div>
              <b class="text-slate-300">Live Recording:</b> Run the companion recorder (<code class="text-slate-300 font-mono">zh_recorder.py</code>) alongside Zero Hour to capture exact live memory events, casualties, and custom-named telemetry logs!

      </div>
      <div class="text-[11px] text-slate-500 mt-2">Space = Play/Pause · Scroll = Zoom · Drag = Pan · Click activity strip or engagements to jump</div>
    </div>

    <div class="space-y-3">
      <div class="card p-3.5">
        <div class="k mb-1.5 flex justify-between items-center">
          <span>Map Control Domination</span>
          <span id="ctrlText" class="text-xs text-sky-400 font-bold font-mono">50% / 50%</span>
        </div>
        <div id="ctrlBar" class="flex h-2.5 rounded-full overflow-hidden bg-slate-800"></div>
      </div>

      <div class="card p-3.5">
        <div class="k mb-2">Live Player Status</div>
        <div id="mScore" class="space-y-2"></div>
      </div>

      <div class="card p-3.5">
        <div class="k mb-2 flex justify-between">
          <span>⚡ Ground Engagements</span>
          <span class="text-slate-400 font-normal">(${r.engagements.length})</span>
        </div>
        <div id="mClashes" class="space-y-1.5 max-h-56 overflow-y-auto pr-1 custom-scrollbar text-xs">
          ${r.engagements.length ? r.engagements.map(c => `
            <div class="flex items-center justify-between p-2 rounded bg-slate-900/80 border border-slate-800 hover:border-sky-500 cursor-pointer transition-colors" onclick="jumpToTime(${c.s})">
              <div class="flex items-center gap-1.5">
                <span class="font-mono text-amber-400 font-bold">${fmt(c.s)}</span>
                <span class="text-white font-medium">Clash #${c.id}</span>
              </div>
              <span class="font-mono text-[11px] text-slate-400">${c.orders} orders</span>
            </div>
          `).join('') : '<div class="text-slate-500 text-center py-2">No heavy multi-team clashes recorded</div>'}
        </div>
      </div>
    </div>
  </div>`;

  const cv = $('mc'), ctx = cv.getContext('2d'), dpr = devicePixelRatio;
  let W, H;
  const size = () => {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  size();

  const KNOWN_BOUNDS = {
    "keepofthebeach": { x0: 0, x1: 3050, y0: 0, y1: 3050 },
    "keeeeeeeeeepofthebeach": { x0: 0, x1: 3050, y0: 0, y1: 3050 },
    "homelandrocks": { x0: 0, x1: 3500, y0: 0, y1: 3500 },
    "homelandrocksrotr": { x0: 0, x1: 3500, y0: 0, y1: 3500 },
    "rankhomelandrockszhv4": { x0: 0, x1: 3500, y0: 0, y1: 3500 },
    "saltlakeriver": { x0: 0, x1: 3200, y0: 0, y1: 3200 },
    "saltlakeriverzhv1": { x0: 0, x1: 3200, y0: 0, y1: 3200 },
    "ranksaltlakeriverzhv1": { x0: 0, x1: 3200, y0: 0, y1: 3200 },
    "purificationzhv1": { x0: 0, x1: 3000, y0: 0, y1: 3000 },
    "rankpurificationzhv1": { x0: 0, x1: 3000, y0: 0, y1: 3000 },
    "farmlandsofthefallen": { x0: 0, x1: 3000, y0: 0, y1: 3000 },
    "farmlandsofthefallenzhv1": { x0: 0, x1: 3000, y0: 0, y1: 3000 },
    "rankfarmlandsofthefallenzhv1": { x0: 0, x1: 3000, y0: 0, y1: 3000 },
    "keepofthesnow": { x0: 0, x1: 3000, y0: 0, y1: 3000 },
    "keepofthesnowrotrc": { x0: 0, x1: 3000, y0: 0, y1: 3000 },
    "volcanostupendousannoyance": { x0: 0, x1: 4000, y0: 0, y1: 4000 },
    "volcanostupendousannoyance8p": { x0: 0, x1: 4000, y0: 0, y1: 4000 },
    "volcanostupendousannoyancerotrc8p": { x0: 0, x1: 4000, y0: 0, y1: 4000 },
    "armoredfury": { x0: 0, x1: 3000, y0: 0, y1: 3000 },
    "armoredfuryrotr": { x0: 0, x1: 3000, y0: 0, y1: 3000 }
  };

  const nmMap = normMap(r.map);
  const allPts = [];
  Object.values(r.P).forEach(p => {
    p.builds.forEach(b => b.x && allPts.push([b.x, b.y]));
    p.moves.forEach(m => allPts.push([m.x, m.y]));
  });
  const xs = allPts.map(a => a[0]), ys = allPts.map(a => a[1]);

  let x0, x1, y0, y1;
  if (KNOWN_BOUNDS[nmMap]) {
    x0 = KNOWN_BOUNDS[nmMap].x0;
    x1 = KNOWN_BOUNDS[nmMap].x1;
    y0 = KNOWN_BOUNDS[nmMap].y0;
    y1 = KNOWN_BOUNDS[nmMap].y1;
  } else if (xs.length && Math.min(...xs) < -200) {
    const maxCoord = Math.max(...xs.map(Math.abs), ...ys.map(Math.abs));
    const sz = Math.max(1500, Math.ceil(maxCoord / 500) * 500);
    x0 = -sz; x1 = sz; y0 = -sz; y1 = sz;
  } else {
    const maxX = xs.length ? Math.max(...xs) : 3000;
    const maxY = ys.length ? Math.max(...ys) : 3000;
    const maxCoord = Math.max(maxX, maxY);
    const sz = maxCoord <= 3000 ? 3000 : (maxCoord <= 3500 ? 3500 : (maxCoord <= 4000 ? 4000 : Math.ceil(maxCoord / 500) * 500));
    x0 = 0; x1 = sz; y0 = 0; y1 = sz;
  }
  
  const worldW = x1 - x0 || 1;
  const worldH = y1 - y0 || 1;
  const base = () => Math.min((W - 40) / worldW, (H - 40) / worldH);
  const X = x => W / 2 + ((x - (x0 + x1) / 2) * base() * MS.zoom) + MS.px;
  const Y = y => H / 2 - ((y - (y0 + y1) / 2) * base() * MS.zoom) + MS.py;

  const powers = r.ev.filter(e => e.type == "Power").map(e => {
    const m = e.txt.match(/\((-?\d+), (-?\d+)\)/);
    return m ? { s: e.s, p: e.p, x: +m[1], y: +m[2], txt: e.txt } : null;
  }).filter(Boolean);

  const rgba = (h, a) => {
    const n = parseInt(h.slice(1), 16);
    return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`;
  };

  function frame() {
    const T = MS.T, animSec = performance.now() / 1000;
    ctx.clearRect(0, 0, W, H);

    // 1. Terrain Layer with Calibration & Accurate SAGE Grid Alignment
    if (L.terrain && MS.loadedImg) {
      const nm = normMap(r.map);
      const cal = MS.calibrations[nm] || (MS.calibrations[nm] = { ox: 0, oy: 0, sx: 1, sy: 1 });
      if (!cal.sx || isNaN(cal.sx)) cal.sx = 1;
      if (!cal.sy || isNaN(cal.sy)) cal.sy = 1;
      const b = base() * MS.zoom;
      const baseW = worldW * b;
      const baseH = worldH * b;
      const imgW = Math.max(10, baseW * cal.sx);
      const imgH = Math.max(10, baseH * cal.sy);
      const imgLeft = X(x0) + (cal.ox || 0) * b;
      const imgTop = Y(y1) - (cal.oy || 0) * b;
      const imgX = imgLeft;
      const imgY = imgTop;

      ctx.save();
      ctx.globalAlpha = MS.opacity;
      ctx.drawImage(MS.loadedImg, imgX, imgY, imgW, imgH);
      ctx.restore();
    }

    // 2. Coordinate Grid
    ctx.strokeStyle = L.terrain && MS.loadedImg ? "rgba(56,189,248,.12)" : "rgba(56,189,248,.2)";
    ctx.lineWidth = 1;
    const gs = 45 * MS.zoom;
    for (let x = (MS.px + W / 2) % gs; x < W; x += gs) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = (MS.py + H / 2) % gs; y < H; y += gs) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    const ps = vis(r);

    // 3. Combat Heatmap
    if (L.heat) {
      ps.forEach(p => {
        const col = pc(r, p.id);
        p.moves.forEach(m => {
          if (m.s > T) return;
          const g = ctx.createRadialGradient(X(m.x), Y(m.y), 0, X(m.x), Y(m.y), 24 * MS.zoom);
          g.addColorStop(0, rgba(col, .09));
          g.addColorStop(1, rgba(col, 0));
          ctx.fillStyle = g;
          ctx.fillRect(X(m.x) - 24 * MS.zoom, Y(m.y) - 24 * MS.zoom, 48 * MS.zoom, 48 * MS.zoom);
        });
      });
    }

    // 4. Base Perimeters
    if (L.zones) {
      ps.forEach(p => {
        if (p.left && T > p.last) return;
        const bs = p.builds.filter(b => b.s <= T && b.x);
        if (!bs.length) return;
        const cx = bs.reduce((a, b) => a + b.x, 0) / bs.length, cy = bs.reduce((a, b) => a + b.y, 0) / bs.length;
        const rad = Math.max(50, ...bs.map(b => Math.hypot(b.x - cx, b.y - cy))) * base() * MS.zoom + 20;
        const col = pc(r, p.id);

        const g = ctx.createRadialGradient(X(cx), Y(cy), 0, X(cx), Y(cy), rad);
        g.addColorStop(0, rgba(col, .12));
        g.addColorStop(1, rgba(col, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(X(cx), Y(cy), rad, 0, Math.PI * 2); ctx.fill();

        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = rgba(col, .4);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = "bold 11px system-ui";
        ctx.textAlign = "center";
        ctx.fillStyle = col;
        ctx.fillText(p.name.toUpperCase(), X(cx), Y(cy) - rad - 6);
      });
    }

    // 5. Reinforcement Vectors / Rally Points
    ps.forEach(p => {
      const col = pc(r, p.id);
      p.rally.forEach(rl => {
        const age = T - rl.s;
        if (age < 0 || age > 45) return;
        const a = 1 - age / 45;
        const bs = p.builds.filter(b => b.s <= rl.s && b.x);
        if (!bs.length) return;
        const nearest = bs.slice().sort((a, b) => Math.hypot(a.x - rl.x, a.y - rl.y) - Math.hypot(b.x - rl.x, b.y - rl.y))[0];
        
        ctx.save();
        ctx.strokeStyle = rgba(col, a * 0.7);
        ctx.setLineDash([3, 4]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(X(nearest.x), Y(nearest.y));
        ctx.lineTo(X(rl.x), Y(rl.y));
        ctx.stroke();

        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(X(rl.x), Y(rl.y), 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
    });

    // 6. Click-to-Click Maneuver Chains
    if (L.chains) {
      ps.forEach(p => {
        const col = pc(r, p.id);
        const rec = p.moves.filter(m => m.s <= T && T - m.s < 30);
        if (rec.length > 1) {
          ctx.save();
          ctx.lineWidth = 1.8;
          ctx.setLineDash([4, 4]);
          for (let i = 1; i < rec.length; i++) {
            const age = T - rec[i].s;
            const a = Math.max(0.05, 1 - age / 30);
            ctx.strokeStyle = rgba(col, a * 0.6);
            ctx.beginPath();
            ctx.moveTo(X(rec[i - 1].x), Y(rec[i - 1].y));
            ctx.lineTo(X(rec[i].x), Y(rec[i].y));
            ctx.stroke();
          }
          ctx.restore();
        }
      });
    }

    // 7. Attack Vectors vs Move Orders vs Destination Reticles
    ps.forEach(p => {
      const col = pc(r, p.id);
      const rec = p.moves.filter(m => m.s <= T && T - m.s < 35);
      
      rec.forEach(m => {
        const age = T - m.s, a = 1 - age / 35;
        const x = X(m.x), y = Y(m.y);

        // A. Attack-Move Vectors
        if (L.attackVec && m.kind === "attackMove") {
          ctx.save();
          ctx.strokeStyle = rgba("#f59e0b", a * 0.9);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, Math.PI * 2);
          ctx.stroke();
          // Forward arrow
          ctx.fillStyle = "#f59e0b";
          ctx.beginPath();
          ctx.moveTo(x, y - 8); ctx.lineTo(x + 5, y + 4); ctx.lineTo(x - 5, y + 4); ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        // B. Direct Attack Target / Bombard
        else if (m.kind === "attack" || m.kind === "bombard") {
          ctx.save();
          ctx.strokeStyle = "#ef4444";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(x, y, 7, 0, Math.PI * 2);
          ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y);
          ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10);
          ctx.stroke();
          ctx.restore();
        }
        // C. Standard Move Orders
        else if (L.orders) {
          ctx.fillStyle = rgba(col, a);
          ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
          if (age < 2.5) {
            ctx.strokeStyle = rgba(col, 1 - age / 2.5);
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(x, y, 4 + age * 8, 0, Math.PI * 2); ctx.stroke();
          }
        }
      });
    });

    // 8. Ground-Truth Battle Clashes
    if (L.clashes) {
      r.engagements.forEach(c => {
        if (T < c.s || T > c.end) return;
        const pulse = Math.sin(animSec * 8) * 4;
        const x = X(c.x), y = Y(c.y);

        ctx.save();
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 16 + pulse, 0, Math.PI * 2); ctx.stroke();

        ctx.strokeStyle = "#ef4444";
        ctx.beginPath();
        ctx.moveTo(x - 24, y); ctx.lineTo(x + 24, y);
        ctx.moveTo(x, y - 24); ctx.lineTo(x, y + 24);
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px system-ui";
        ctx.textAlign = "center";
        ctx.shadowColor = "#f59e0b";
        ctx.shadowBlur = 8;
        ctx.fillText(`⚔ CLASH #${c.id}`, x, y - 22);
        ctx.restore();
      });
    }

    // 9. Structures
    if (L.build) {
      ps.forEach(p => {
        // If player has surrendered / quit / died and scrubber time is past their death, remove structures from map!
        if (p.left && T > p.last) return;

        const col = pc(r, p.id);
        p.builds.forEach(b => {
          if (b.s > T || !b.x) return;
          const age = T - b.s, x = X(b.x), y = Y(b.y);
          const sz = Math.max(5, 7 * Math.sqrt(MS.zoom));

          ctx.fillStyle = col;
          ctx.fillRect(x - sz, y - sz, sz * 2, sz * 2);
          ctx.strokeStyle = "rgba(255,255,255,.8)";
          ctx.lineWidth = 1;
          ctx.strokeRect(x - sz, y - sz, sz * 2, sz * 2);

          if (age < 4) {
            const k = age / 4;
            ctx.strokeStyle = rgba(col, 1 - k);
            ctx.lineWidth = 2;
            ctx.strokeRect(x - sz - k * 18, y - sz - k * 18, (sz + k * 18) * 2, (sz + k * 18) * 2);
          }
        });
      });
    }

    // 10. Special Power Strikes
    if (L.powers) {
      powers.forEach(pw => {
        if (hide.has(pw.p) || pw.s > T || T - pw.s > 10) return;
        const age = T - pw.s, col = pc(r, pw.p), x = X(pw.x), y = Y(pw.y);
        for (let i = 0; i < 3; i++) {
          const k = ((age * 1.5 + i * .33) % 1);
          ctx.strokeStyle = rgba(col, (1 - k) * (1 - age / 10));
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(x, y, 12 + k * 80 * Math.sqrt(MS.zoom), 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("⚡ STRIKE", x, y + 5);
      });
    }

    
    // 11. Live Casualties Layer (Pulsating markers & killfeed markers on map)
    if (L.casualties && r.isTelemetry) {
      r.engagements.forEach(c => {
        const dt = T - c.s;
        if (dt >= 0 && dt <= 25) {
          const alpha = Math.max(0.15, 1 - dt / 25);
          const cx = X(c.x), cy = Y(c.y);
          ctx.save();
          ctx.font = `bold ${Math.round(15 * Math.sqrt(MS.zoom))}px system-ui`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.shadowColor = "#ef4444";
          ctx.shadowBlur = 10;
          ctx.fillStyle = `rgba(239, 68, 68, ${alpha})`;
          ctx.fillText("💀", cx, cy - 2);
          ctx.strokeStyle = `rgba(239, 68, 68, ${alpha * 0.8})`;
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(cx, cy, (10 + (dt % 4) * 5) * Math.sqrt(MS.zoom), 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      });
    }

    hud(T);
  }

  function hud(T) {
    $('mClock').textContent = fmt(T);
    $('mPlay').textContent = MS.play ? "⏸ Pause" : (T >= r.dur ? "↺ Replay" : "▶ Play");

    const ps = Object.values(r.P);
    const teams = {};
    ps.forEach(p => {
      const activeScore = p.builds.filter(b => b.s <= T).length * 3 + p.moves.filter(m => m.s <= T && T - m.s < 60).length;
      teams[p.team] = (teams[p.team] || 0) + activeScore;
    });
    const totalScore = Object.values(teams).reduce((a, b) => a + b, 0) || 1;
    const teamEntries = Object.entries(teams);
    if (teamEntries.length) {
      $('ctrlBar').innerHTML = teamEntries.map(([tId, sc], i) => `
        <div style="width:${(sc / totalScore) * 100}%; background-color:${COL[i % COL.length]}" title="Team ${tId}"></div>
      `).join('');
      $('ctrlText').textContent = teamEntries.map(([tId, sc]) => `${Math.round((sc / totalScore) * 100)}%`).join(' / ');
    }

    const ic = { Build: "🏗", Unit: "🪖", Upgrade: "🔬", Power: "⚡", Sell: "💰", Exit: "🏳" };
    const fe = r.ev.filter(e => e.s <= T && T - e.s < 20 * Math.max(1, MS.speed / 10) && e.type != "Unit" && !hide.has(e.p)).slice(-5);
    $('mFeed').innerHTML = fe.map(e => `
      <div class="text-[11px] bg-slate-950/85 backdrop-blur border-l-2 rounded px-2.5 py-1 shadow" style="border-color:${pc(r, e.p)}">
        <span class="font-mono text-slate-400">${fmt(e.s)}</span> ${ic[e.type] || ''} <b style="color:${pc(r, e.p)}">${r.P[e.p]?.name}</b> <span class="text-slate-200">${e.txt}</span>
      </div>
    `).join('');

    $('mScore').innerHTML = ps.map(p => {
      const rec = p.acts.filter(s => s <= T && T - s < 60).length;
      const b = p.builds.filter(x => x.s <= T).length;
      const u = p.units.filter(x => x.s <= T).length;
      const dead = p.left && T > p.last;
      return `
        <div class="rounded-lg p-2 bg-slate-900/80 border border-slate-800 ${dead ? 'opacity-40' : ''}" style="border-left:3px solid ${pc(r, p.id)}">
          <div class="flex justify-between items-center text-xs">
            <b class="text-white">${p.name}</b>
            <span class="font-mono text-sky-400 font-bold">${rec} APM</span>
          </div>
          <div class="h-1.5 bg-slate-800 rounded mt-1.5 overflow-hidden">
            <div class="h-1.5 rounded" style="width:${Math.min(100, rec / 2)}%;background:${pc(r, p.id)};box-shadow:0 0 8px ${pc(r, p.id)}"></div>
          </div>
          <div class="flex justify-between text-[11px] text-slate-400 mt-1 font-mono">
            <span>🏗 ${b}</span><span>🪖 ${u}</span>${dead ? '<span class="text-red-400 font-bold">💀 Out</span>' : ''}
          </div>
        </div>
      `;
    }).join('');

    drawSpark(T);
  }

  const sp = $('spark'), spc = sp.getContext('2d');
  let spW, spH, spBins;
  (function() {
    spW = sp.clientWidth; spH = sp.clientHeight;
    sp.width = spW * dpr; sp.height = spH * dpr;
    spc.scale(dpr, dpr);
    const n = 180;
    spBins = Array(n).fill(0);
    Object.values(r.P).forEach(p => p.acts.forEach(s => spBins[Math.min(n - 1, Math.floor(s / r.dur * n))]++));
  })();

  function drawSpark(T) {
    const n = spBins.length, m = Math.max(...spBins, 1);
    spc.clearRect(0, 0, spW, spH);
    spBins.forEach((v, i) => {
      const x = i / n * spW, on = i / n <= T / r.dur;
      spc.fillStyle = on ? "#0284c7" : "#334155";
      const hh = v / m * (spH - 6);
      spc.fillRect(x, spH - hh, spW / n - 0.8, hh);
    });
    powers.forEach(p => {
      spc.fillStyle = "#a855f7";
      spc.fillRect(p.s / r.dur * spW - 1, 0, 2.5, 6);
    });
    r.engagements.forEach(c => {
      spc.fillStyle = "#f59e0b";
      spc.fillRect(c.s / r.dur * spW - 1, spH - 5, 3, 5);
    });
    const px = T / r.dur * spW;
    spc.fillStyle = "#ffffff";
    spc.shadowColor = "#38bdf8";
    spc.shadowBlur = 8;
    spc.fillRect(px - 1, 0, 2, spH);
    spc.shadowBlur = 0;
  }

  sp.onclick = e => {
    const b = sp.getBoundingClientRect();
    MS.T = (e.clientX - b.left) / b.width * r.dur;
    frame();
  };
  let scrub = false;
  sp.onmousedown = () => scrub = true;
  addEventListener('mouseup', () => scrub = false);
  sp.onmousemove = e => { if (scrub) sp.onclick(e); };

  

// ================= IndexedDB Folder Persistence =================
const IDB_NAME = 'ZH_Analyzer_Storage';
const IDB_STORE = 'dir_handles';

function openDirDB() {
  return new Promise(resolve => {
    if (!window.indexedDB) return resolve(null);
    try {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch(e) { resolve(null); }
  });
}

async function saveDirHandle(key, handle) {
  try {
    const db = await openDirDB();
    if (!db) return;
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(handle, key);
  } catch(e) { console.warn("Could not save dir handle:", e); }
}

async function getDirHandle(key) {
  try {
    const db = await openDirDB();
    if (!db) return null;
    return new Promise(resolve => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch(e) { return null; }
}

(function() {
  const sb = $('sidebar'), resizer = $('sbResize'), toggleBtn = $('sbToggle'), openBtn = $('sbOpenBtn');
  let isResizing = false;
  let savedW = 380;
  try {
    savedW = parseInt(localStorage.zh_sidebar_w) || 380;
    if (sb) sb.style.width = savedW + 'px';
  } catch(e){}

  if (resizer) {
    resizer.addEventListener('pointerdown', e => {
      e.preventDefault();
      isResizing = true;
      try { resizer.setPointerCapture(e.pointerId); } catch(err){}
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    resizer.addEventListener('pointermove', e => {
      if (!isResizing || !sb) return;
      const isRTL = document.body.getAttribute('dir') === 'rtl';
      const newW = isRTL 
        ? Math.min(800, Math.max(220, window.innerWidth - e.clientX))
        : Math.min(800, Math.max(220, e.clientX));
      sb.style.width = newW + 'px';
      savedW = newW;
      try { localStorage.zh_sidebar_w = newW; } catch(e){}
    });

    const endResize = e => {
      if (isResizing) {
        isResizing = false;
        try { resizer.releasePointerCapture(e.pointerId); } catch(err){}
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    };
    resizer.addEventListener('pointerup', endResize);
    resizer.addEventListener('pointercancel', endResize);
  }

  // Toggle Collapse
  function setSidebarCollapsed(collapsed) {
    if (!sb) return;
    if (collapsed) {
      sb.style.display = 'none';
      if (resizer) resizer.style.display = 'none';
      if (openBtn) openBtn.classList.remove('hidden');
    } else {
      sb.style.display = 'flex';
      sb.style.width = savedW + 'px';
      if (resizer) resizer.style.display = 'flex';
      if (openBtn) openBtn.classList.add('hidden');
    }
    try { localStorage.zh_sidebar_collapsed = collapsed ? '1' : '0'; } catch(e){}
  }

  if (toggleBtn) {
    toggleBtn.onclick = () => setSidebarCollapsed(true);
  }
  if (openBtn) {
    openBtn.onclick = () => setSidebarCollapsed(false);
  }

  if (localStorage.zh_sidebar_collapsed === '1') {
    setSidebarCollapsed(true);
  }

  // Language Selector Handler
  const langSel = $('langSelect');
  if (langSel) {
    langSel.value = curLang;
    langSel.onchange = e => {
      curLang = e.target.value;
      try { localStorage.zh_lang = curLang; } catch(e){}
      applyI18N();
    };
    if (curLang === 'ar') document.body.setAttribute('dir', 'rtl');
  }
})();

  };

  MS.last = performance.now();
  MS.raf = requestAnimationFrame(loop);
};

let DIR = null;

async function scanDir(h) {
  saveDirHandle('replay_dir', h);
  const reps = [];
  const telems = [];
  const tgas = {};
  for await (const e of h.values()) {
    if (e.kind == 'file') {
      if (/\.rep$/i.test(e.name)) {
        const f = await e.getFile();
        reps.push({ f, t: f.lastModified });
      } else if (/\.(zhtelemetry|json)$/i.test(e.name)) {
        const f = await e.getFile();
        telems.push(f);
      } else if (/\.tga$/i.test(e.name)) {
        const f = await e.getFile();
        const b = await f.arrayBuffer();
        const url = parseTga(b);
        if (url) tgas[normMap(f.name)] = url;
      }
    }
  }
  reps.sort((a, b) => b.t - a.t);
  await loadList(reps.map(o => o.f), h.name, tgas, telems);
}

async function loadList(files, label, tgaDict = {}, telemFiles = []) {
  const keep = R.filter(r => r._manual);
  R = [...keep];
  
  for (const tf of telemFiles) {
    try {
      const txt = await tf.text();
      const x = parseTelemetryJSON(txt, tf.name);
      if (x) R.push(x);
    } catch(e){}
  }

  for (const f of files) {
    try {
      const b = await f.arrayBuffer();
      const nm = normMap(f.name);
      const x = parse(b, f.name, tgaDict[nm] || null);
      if (x) R.push(x);
    } catch(e){}
  }
  cur = 0;
  $('dirInfo').textContent = `📂 ${label} · ${R.length} entries loaded`;
  render();
}

            if (subEntry.kind === 'file' && /\.tga$/i.test(subEntry.name)) {
              const f = await subEntry.getFile();
              const b = await f.arrayBuffer();
              const url = parseTga(b);
              if (url) {
                MAP_TERRAINS[normMap(f.name)] = url;
                loaded++;
              }
            }
          }
        } else if (entry.kind === 'file' && /\.tga$/i.test(entry.name)) {
          const f = await entry.getFile();
          const b = await f.arrayBuffer();
          const url = parseTga(b);
          if (url) {
            MAP_TERRAINS[normMap(entry.name)] = url;
            loaded++;
          }
        }
      }
      $('dirInfo').innerHTML = `<span class="text-emerald-400 font-semibold">✓ Loaded ${loaded} map backgrounds!</span>`;
      render();
    } catch(e){}
  }
};

$('dirBtn').onclick = async () => {
  if (window.showDirectoryPicker) {
    try {
      DIR = await showDirectoryPicker({ id: 'zhreplays', mode: 'read' });
      await idbSet(DIR);
      $('refBtn').classList.remove('hidden');
      scanDir(DIR);
    } catch(e){}
  } else $('fd').click();
};

$('fd').onchange = e => {
  const fs = [...e.target.files].filter(f => /\.(rep|zhtelemetry)$/i.test(f.name)).sort((a, b) => b.lastModified - a.lastModified);
  loadList(fs, fs[0]?.webkitRelativePath.split('/')[0] || 'folder');
};

$('refBtn').onclick = async () => {
  if (!DIR) return;
  if (await DIR.requestPermission({ mode: 'read' }) == 'granted') scanDir(DIR);
};

(async () => {
  if (!window.showDirectoryPicker) return;
  DIR = await idbGet().catch(() => null);
  if (!DIR) return;
  $('refBtn').classList.remove('hidden');
  if (await DIR.queryPermission({ mode: 'read' }) == 'granted') scanDir(DIR);
  else {
    $('dirInfo').innerHTML = `📂 ${DIR.name} remembered — <a href="#" id="re" class="text-sky-400 underline font-semibold">click to reload</a>`;
    $('re').onclick = e => { e.preventDefault(); $('refBtn').click(); };
  }
})();

$('q').oninput = list;
$('csv').onclick = csv;
$('fi').onchange = e => addFiles(e.target.files);

addEventListener('dragover', e => { e.preventDefault(); $('drop').style.display = 'flex'; });
$('drop').ondragleave = () => $('drop').style.display = 'none';
addEventListener('drop', e => { e.preventDefault(); $('drop').style.display = 'none'; addFiles(e.dataTransfer.files); });
addEventListener('resize', () => render());

applyI18N();
</script></body></html>
